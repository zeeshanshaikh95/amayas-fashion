<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Brand typography: high-contrast editorial serif, geometric sans, script accent -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Jost:wght@300;400;500;600&family=Pinyon+Script&display=swap"
      rel="stylesheet"
    />

    <!-- Favicons / app icons derived from the brand mark -->
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="%BASE_URL%favicon-48.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="theme-color" content="#230A11" />

    <title>Amayas Fashion — Elegance in Every Thread</title>
    <meta
      name="description"
      content="Dresses, co-ords, tunics, bags and modest wear from Amayas Fashion. Sizes small to 10XL, worldwide shipping. Browse the collection and order directly on WhatsApp."
    />
    <!--
      Site-wide social card. WhatsApp / Facebook / Twitter scrapers do not run
      JavaScript, so these static tags are what they read for ANY url — values
      must be absolute. Per-page metadata is added by the app (Helmet) for
      JS-capable crawlers such as Google.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Amayas Fashion" />
    <meta property="og:title" content="Amayas Fashion — Elegance in Every Thread" />
    <meta
      property="og:description"
      content="Festive dresses, co-ords and everyday pieces in sizes small to 10XL. Worldwide shipping, order on WhatsApp."
    />
    <meta property="og:url" content="https://zeeshanshaikh95.github.io/amayas-fashion/" />
    <meta
      property="og:image"
      content="https://zeeshanshaikh95.github.io/amayas-fashion/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Amayas Fashion — Elegance in Every Thread" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
